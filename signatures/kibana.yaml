id: kibana
name: Kibana
category: admin-panel
confidence: 90
description: Panel Kibana (nagłówki kbn-name/kbn-version, metadane kbn-injected-metadata).
condition: or
cwe: [668]
attack: [T1078]
remediation: 'Włącz uwierzytelnianie Elastic Security i udostępniaj Kibanę tylko z sieci wewnętrznej.'
matchers:
  - type: header
    name: Kbn-Version
    regex: '(?P<version>[0-9][0-9.]*)'
  - type: header
    name: Kbn-Name
  - type: body
    regex: 'kbn-injected-metadata|__kbnBootstrap__|kbnInjectedMetadata'
  - type: title
    regex: '^Kibana$|^Elastic$'
