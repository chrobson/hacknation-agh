id: dvwa
name: DVWA (celowo podatna aplikacja)
category: other
confidence: 95
severity: high
description: Damn Vulnerable Web Application, aplikacja z celowo wprowadzonymi podatnościami (SQLi, XSS, command injection) i znanymi domyślnymi hasłami. Wykrycie po tytule strony logowania lub konfiguracji i zasobach dvwa/ (tylko GET, bez logowania).
condition: or
cwe: [1188]
attack: [T1190]
remediation: 'Usuń celowo podatną aplikację DVWA z sieci dostępnej dla użytkowników albo odizoluj ją w laboratorium.'
matchers:
  - type: title
    regex: '(?i)Damn Vulnerable Web Application(?: \(DVWA\))?(?: v(?P<version>[0-9][0-9.]*))?'
  - type: body
    regex: '(?i)dvwa/(?:images/login_logo\.png|css/login\.css|js/dvwaPage\.js)'
