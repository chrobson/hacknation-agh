id: apache-server-status
name: Apache mod_status (/server-status)
category: server
confidence: 90
description: Publicznie dostępna strona /server-status modułu mod_status (ujawnia klientów i adresy URL).
condition: or
cwe: [497]
remediation: 'Ogranicz /server-status dyrektywą Require ip do adresów monitoringu albo wyłącz mod_status.'
references:
  - https://httpd.apache.org/docs/2.4/mod/mod_status.html
matchers:
  - type: path
    path: /server-status
    status: [200]
    regex: 'Apache Server Status for|Server Version: Apache(?:/(?P<version>[0-9.]+))?'
