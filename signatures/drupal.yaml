id: drupal
name: Drupal
category: cms
confidence: 90
description: CMS Drupal (X-Generator, X-Drupal-Cache, atrybuty data-drupal, ciasteczko SESS<hash>).
condition: or
matchers:
  - type: header
    name: X-Generator
    regex: 'Drupal ?(?P<version>\d+)?'
  - type: header
    name: X-Drupal-Cache
  - type: header
    name: X-Drupal-Dynamic-Cache
  - type: body
    regex: 'Drupal\.settings|data-drupal-selector|<meta name="Generator" content="Drupal'
  - type: cookie
    regex: '^S?SESS[0-9a-f]{32}$'
