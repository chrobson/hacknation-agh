id: mysql
name: MySQL/MariaDB dostępny z sieci
category: server
confidence: 90
severity: medium
description: Serwer MySQL lub MariaDB przyjmuje połączenia z sieci (produkt lub nazwa usługi z nmapa). MySQL starszy niż 8.0 (np. 5.7, koniec wsparcia w 2023) jest oznaczany jako nieaktualny; wersje MariaDB (5.5.5-10.x) nie są porównywane.
condition: or
outdated:
  below: "8.0"
  severity: high
cwe: [1104, 668]
attack: [T1190]
remediation: 'Zaktualizuj MySQL do wspieranej wersji i ogranicz port 3306 do serwerów aplikacji.'
matchers:
  - type: service
    product: '(?i)^MySQL(?: (?P<version>[0-9]+\.[0-9]+\.[0-9]+)(?:$|[^-0-9.]))?'
  - type: service
    product: '(?i)MariaDB'
  - type: service
    banner: '^mysql'
