id: traefik-dashboard
name: Dashboard i API Traefika bez uwierzytelnienia
category: admin-panel
confidence: 90
severity: high
description: Dashboard Traefika dostępny bez uwierzytelnienia, typowo przez api.insecure=true na porcie 8080 (/ przekierowuje na /dashboard/). Ujawnia routery, usługi, backendy i middleware całej infrastruktury. Wersja z /api/version, odpytywanego tylko po rozpoznaniu dashboardu.
condition: or
matchers:
  - type: title
    regex: '^Traefik$'
  - type: body
    regex: '<meta name="?description"? content="?Traefik UI'
  - type: path
    path: /api/version
    status: [200]
    version_only: true
    regex: '"Version"\s*:\s*"v?(?P<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)[^"]*"\s*,\s*"Codename"'
