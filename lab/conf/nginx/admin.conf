# admin-app (10.20.9.110): simple app exposing /login (form) and /admin (HTTP Basic, 401).
server {
    listen 80 default_server;
    root /srv/www;
    index index.html;
    location = /login { default_type text/html; try_files /login.html =404; }
    location /admin {
        auth_basic "Admin Panel";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        default_type text/html;
        try_files /admin.html =404;
    }
}
