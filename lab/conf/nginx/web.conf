# nginx-web (10.20.0.10): public site + "staging" virtual host selected by Host header.
server {
    listen 80 default_server;
    server_name www.lab.local lab.local _;
    root /srv/www;
    index index.html;
}
server {
    listen 80;
    server_name staging.lab.local;
    root /srv/staging;
    index index.html;
    add_header X-Environment staging always;
}
