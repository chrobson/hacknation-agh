# nginx-tls (10.20.0.11): HTTP->HTTPS redirect + self-signed certificate (CN=secure.lab.local).
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name secure.lab.local;
    ssl_certificate     /etc/nginx/tls/secure.crt;
    ssl_certificate_key /etc/nginx/tls/secure.key;
    location / { default_type text/html; return 200 "<html><head><title>ACME Secure Portal</title></head><body><h1>ACME Secure Portal</h1></body></html>\n"; }
}
