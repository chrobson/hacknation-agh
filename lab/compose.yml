# Attack Surface Intelligence - scan lab.
#
# Dedicated docker network 10.20.0.0/18 (16,384 addresses) with ~30 targets on fixed IPs spread
# across the whole range, plus a "scanner" container (nmap, NET_RAW) attached to the same network.
# Use ./change.sh run1|run2|run3 to bring the lab up in a given variant (compose overrides in
# variants/). Ground truth per variant: expected/runN.json. ONLY scan this network.
name: asi-lab

x-targets: &targets
  image: asi-lab-targets:local
  build:
    context: .
    dockerfile: targets.Dockerfile
  restart: unless-stopped

x-busybox: &busybox
  image: busybox:1.36.1
  restart: unless-stopped

networks:
  lab:
    name: asi-lab
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/18
          gateway: 10.20.0.1

services:
  # ---------------------------------------------------------------- scanner
  scanner:
    image: asi-lab-scanner:local
    build:
      context: .
      dockerfile: scanner.Dockerfile
    cap_add: [NET_RAW, NET_ADMIN]
    networks:
      lab: { ipv4_address: 10.20.63.250 }
    restart: unless-stopped

  # ---------------------------------------------------------------- web
  nginx-web:            # public site + staging vhost (Host: staging.lab.local)
    image: nginx:1.27.3-alpine
    volumes:
      - ./conf/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/www/nginx-web:/srv/www:ro
      - ./conf/www/staging:/srv/staging:ro
    networks:
      lab: { ipv4_address: 10.20.0.10 }
    restart: unless-stopped

  nginx-tls:            # 80 -> 301 https, 443 self-signed (CN=secure.lab.local)
    image: nginx:1.27.3-alpine
    volumes:
      - ./conf/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/tls:/etc/nginx/tls:ro
    networks:
      lab: { ipv4_address: 10.20.0.11 }
    restart: unless-stopped

  wordpress:
    image: wordpress:6.6.2-php8.2-apache
    environment:
      WORDPRESS_DB_HOST: 10.20.1.21
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-lab-pass
      WORDPRESS_DB_NAME: wordpress
    depends_on: [wp-db]
    networks:
      lab: { ipv4_address: 10.20.1.20 }
    restart: unless-stopped

  wp-db:
    image: mariadb:11.4.4
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF"]
    environment:
      MARIADB_ROOT_PASSWORD: root-lab-pass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-lab-pass
    networks:
      lab: { ipv4_address: 10.20.1.21 }
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    environment:
      PMA_HOST: 10.20.1.21
    networks:
      lab: { ipv4_address: 10.20.1.30 }
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:2.479.3-lts-jdk17
    environment:
      JAVA_OPTS: "-Xmx384m -Djenkins.install.runSetupWizard=false"
    networks:
      lab: { ipv4_address: 10.20.2.40 }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      lab: { ipv4_address: 10.20.3.50 }
    restart: unless-stopped

  tomcat:               # Tomcat 9 with the manager app reachable remotely (tomcat/tomcat)
    image: tomcat:9.0.97-jre17
    command:
      - sh
      - -c
      - >-
        cp -r /usr/local/tomcat/webapps.dist/ROOT /usr/local/tomcat/webapps.dist/manager /usr/local/tomcat/webapps/ &&
        cp /lab/manager-context.xml /usr/local/tomcat/webapps/manager/META-INF/context.xml &&
        cp /lab/tomcat-users.xml /usr/local/tomcat/conf/tomcat-users.xml &&
        exec catalina.sh run
    environment:
      CATALINA_OPTS: "-Xmx192m"
    volumes:
      - ./conf/tomcat:/lab:ro
    networks:
      lab: { ipv4_address: 10.20.4.60 }
    restart: unless-stopped

  gitea:                # "another web UI" (lighter than Kibana): web 3000 + built-in OpenSSH 22
    image: gitea/gitea:1.22.3
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: git.lab.local
    networks:
      lab: { ipv4_address: 10.20.5.70 }
    restart: unless-stopped

  admin-app:            # simple app with /login form and /admin (401 Basic)
    image: nginx:1.27.3-alpine
    volumes:
      - ./conf/nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/nginx/admin.htpasswd:/etc/nginx/admin.htpasswd:ro
      - ./conf/www/admin-app:/srv/www:ro
    networks:
      lab: { ipv4_address: 10.20.9.110 }
    restart: unless-stopped

  apache:               # version changes between runs (see variants/)
    image: httpd:2.4.58-alpine
    networks:
      lab: { ipv4_address: 10.20.40.70 }
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    networks:
      lab: { ipv4_address: 10.20.44.80 }
    restart: unless-stopped

  haproxy:
    image: haproxy:3.0.6-alpine
    volumes:
      - ./conf/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      lab: { ipv4_address: 10.20.52.100 }
    restart: unless-stopped

  web-8443:             # HTTPS on 8443 with an expired self-signed certificate
    image: nginx:1.27.3-alpine
    volumes:
      - ./conf/nginx/expired.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/tls:/etc/nginx/tls:ro
    networks:
      lab: { ipv4_address: 10.20.56.110 }
    restart: unless-stopped

  # ---------------------------------------------------------------- infra / data
  sshd:
    <<: *targets
    networks:
      lab: { ipv4_address: 10.20.6.80 }

  mysql:
    image: mysql:8.4.3
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: root-lab-pass
    networks:
      lab: { ipv4_address: 10.20.7.90 }
    restart: unless-stopped

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_PASSWORD: pg-lab-pass
    networks:
      lab: { ipv4_address: 10.20.10.120 }
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    networks:
      lab: { ipv4_address: 10.20.11.130 }
    restart: unless-stopped

  nats:
    image: nats:2.10.22-alpine
    command: ["-m", "8222"]
    networks:
      lab: { ipv4_address: 10.20.12.140 }
    restart: unless-stopped

  memcached:            # removed in run2 / run3
    image: memcached:1.6.32-alpine
    networks:
      lab: { ipv4_address: 10.20.36.60 }
    restart: unless-stopped

  coredns:              # DNS for lab.local names (incl. staging.lab.local)
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./conf/Corefile:/etc/coredns/Corefile:ro
    networks:
      lab: { ipv4_address: 10.20.48.90 }
    restart: unless-stopped

  # ---------------------------------------------------------------- IoT
  mosquitto:            # MQTT broker, anonymous access
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      lab: { ipv4_address: 10.20.8.100 }
    restart: unless-stopped

  telnet-iot:           # "IoT router": telnet 23 + web management 80 (telnet closed in run2/run3)
    <<: *targets
    command: ["sh", "-c", "busybox-extras httpd -p 80 -h /www && exec /lab/telnet-banner.sh 23"]
    volumes:
      - ./conf/www/telnet-iot:/www:ro
      - ./conf/telnet-banner.sh:/lab/telnet-banner.sh:ro
    networks:
      lab: { ipv4_address: 10.20.24.30 }

  ipcam:                # "IP camera" web UI
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/www"]
    volumes:
      - ./conf/www/ipcam:/www:ro
    networks:
      lab: { ipv4_address: 10.20.32.50 }

  # ---------------------------------------------------------------- minimal hosts
  bb-http:              # gains port 8000 in run2 / run3
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/www"]
    volumes:
      - ./conf/www/bb-http:/www:ro
    networks:
      lab: { ipv4_address: 10.20.16.10 }

  bb-http-alt:
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    volumes:
      - ./conf/www/bb-http-alt:/www:ro
    networks:
      lab: { ipv4_address: 10.20.16.11 }

  ftp-banner:
    <<: *targets
    command: ["/lab/banner.sh", "21", "220 (vsFTPd 3.0.3)"]
    volumes:
      - ./conf/banner.sh:/lab/banner.sh:ro
    networks:
      lab: { ipv4_address: 10.20.20.20 }

  smtp-banner:          # banner changes in run3 (Postfix -> Exim)
    <<: *targets
    command: ["/lab/banner.sh", "25", "220 mail.lab.local ESMTP Postfix (Debian/GNU)"]
    volumes:
      - ./conf/banner.sh:/lab/banner.sh:ro
    networks:
      lab: { ipv4_address: 10.20.20.21 }

  legacy-ssh:           # old OpenSSH banner; "upgraded" in run2
    <<: *targets
    command: ["/lab/banner.sh", "22", "SSH-2.0-OpenSSH_7.4"]
    volumes:
      - ./conf/banner.sh:/lab/banner.sh:ro
    networks:
      lab: { ipv4_address: 10.20.28.40 }

  flappy:               # UNSTABLE host: up in run1, gone in run2, back in run3
    <<: *busybox
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/www"]
    volumes:
      - ./conf/www/flappy:/www:ro
    networks:
      lab: { ipv4_address: 10.20.60.120 }
