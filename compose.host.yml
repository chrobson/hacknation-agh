# Scanning services published on the docker host (localhost), two uses:
#
# 1. Linux: the app shares the host network namespace, so 127.0.0.1 and
#    "localhost" inside the app are the host's loopback.
#      docker compose -f compose.yml -f compose.host.yml up -d --build
#    (make up-host). The UI listens on 127.0.0.1:${ASI_PORT:-9080} of the host.
#    Docker Desktop supports host networking only from 4.34 with the feature
#    turned on; on a Mac prefer compose.hostgw.yml or the native mode.
#
# 2. Native mode (asi binary and nmap on the host, any OS): only the database
#    runs in docker and is published on the host loopback.
#      docker compose -f compose.yml -f compose.host.yml up -d --wait db
#    (make native-db), then see README section 2a.
services:
  db:
    ports:
      - "127.0.0.1:${ASI_DB_PORT:-55432}:5432"

  app:
    network_mode: host
    ports: !reset []
    environment:
      ASI_DATABASE_URL: postgres://${ASI_DB_USER:-asi}:${ASI_DB_PASSWORD}@127.0.0.1:${ASI_DB_PORT:-55432}/asi?sslmode=disable
      ASI_HTTP_ADDR: 127.0.0.1:${ASI_PORT:-9080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${ASI_PORT:-9080}/healthz || exit 1"]
