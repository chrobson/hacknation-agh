# Local DefectDojo for ASI integration tests and the demo.
#
# This is the OFFICIAL docker-compose.yml of DefectDojo (BSD-3-Clause,
# https://github.com/DefectDojo/django-DefectDojo/blob/3.5.202/docker-compose.yml)
# pinned to release 3.5.202, with four changes:
#   - images are pinned to 3.5.202 and the build sections are removed
#     (nothing is built locally),
#   - secrets have no defaults: they come from deploy/defectdojo/.env, which
#     `make dojo-env` generates with random values,
#   - nginx publishes 127.0.0.1:${DD_PORT:-8081} so it does not clash with
#     ASI on :9080 and is not exposed outside the host,
#   - DD_HASHCODE_FIELDS_PER_SCANNER makes Generic Findings dedupe on
#     title + severity + endpoints (see x-dd-env).
#
# Run it SEPARATELY from the main compose (several containers, ~4 GB RAM,
# first start takes several minutes):
#   make -f mk/dojo.mk dojo-up        (or `make dojo-up` once mk/dojo.mk is included)
#   make -f mk/dojo.mk dojo-password  # prints "Admin password: ..." from the initializer log
# The admin password is generated by the initializer; it is never stored here.
name: defectdojo

x-dd-env: &dd-env
  DD_DATABASE_URL: postgresql://defectdojo:${DD_DATABASE_PASSWORD:?run make dojo-env}@postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://valkey:6379/0
  DD_CACHE_URL: redis://valkey:6379/1
  DD_SECRET_KEY: ${DD_SECRET_KEY:?run make dojo-env}
  DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?run make dojo-env}
  DD_DATABASE_READINESS_TIMEOUT: "${DD_DATABASE_READINESS_TIMEOUT:-60}"
  # ASI addition: dedupe Generic Findings by title + severity + endpoints
  # (the ASI contract) instead of the legacy title + description hash, so
  # analyst comments or HTTP title changes do not recreate findings on reimport.
  DD_HASHCODE_FIELDS_PER_SCANNER: '{"Generic Findings Import": ["title", "severity", "endpoints"]}'

x-dd-image: &dd-image "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-django:3.5.202"

services:
  nginx:
    image: "${DD_IMAGE_REGISTRY:-docker.io}/defectdojo/defectdojo-nginx:3.5.202"
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      - "127.0.0.1:${DD_PORT:-8081}:8080"
  uwsgi:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '30', '--', '/entrypoint-uwsgi.sh']
    environment:
      <<: *dd-env
      DD_DEBUG: "False"
      DD_DJANGO_METRICS_ENABLED: "False"
      DD_ALLOWED_HOSTS: "*"
    volumes:
      - ./extra_settings:/app/docker/extra_settings
      - defectdojo_media:/app/media
  celerybeat:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '30', '--', '/entrypoint-celery-beat.sh']
    environment:
      <<: *dd-env
    volumes:
      - ./extra_settings:/app/docker/extra_settings
  celeryworker:
    image: *dd-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '30', '--', '/entrypoint-celery-worker.sh']
    environment:
      <<: *dd-env
    volumes:
      - ./extra_settings:/app/docker/extra_settings
      - defectdojo_media:/app/media
  initializer:
    image: *dd-image
    depends_on:
      postgres:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '--', '/entrypoint-initializer.sh']
    environment:
      <<: *dd-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: User
      DD_INITIALIZE: "true"
    volumes:
      - ./extra_settings:/app/docker/extra_settings
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:?run make dojo-env}
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    volumes:
      - defectdojo_redis:/data

volumes:
  defectdojo_postgres: {}
  defectdojo_media: {}
  defectdojo_redis: {}
