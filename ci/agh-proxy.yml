# Fault-injection lab for scripts/e2e-toxi.sh, written for this repository:
# WordPress (MariaDB) behind Toxiproxy behind Traefik, the same kind of
# stack as the AGH "modern-proxy" scenario, without any of its files. Host
# ports can be moved (TOXI_WEB_PORT, TOXI_DASH_PORT, TOXI_API_PORT) so the
# stack can run next to another copy. The proxy "wordpress" (listen :8666)
# is created by the script. Passwords are throwaway CI values.
name: ${TOXI_PROJECT:-asi-toxi-lab}

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    ports:
      - "${TOXI_WEB_PORT:-8085}:80"
      - "${TOXI_DASH_PORT:-8086}:8080"
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    depends_on: [toxiproxy]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "${TOXI_API_PORT:-8474}:8474"
  wordpress:
    image: wordpress:latest
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ci-only-not-a-secret
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ci-only-not-a-secret-root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ci-only-not-a-secret
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
