# Traefik file provider for ci/agh-proxy.yml: every request on the web
# entry point goes to the Toxiproxy listener in front of WordPress.
http:
  routers:
    to-toxiproxy:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      service: toxiproxy-wp
  services:
    toxiproxy-wp:
      loadBalancer:
        servers:
          - url: "http://toxiproxy:8666"
